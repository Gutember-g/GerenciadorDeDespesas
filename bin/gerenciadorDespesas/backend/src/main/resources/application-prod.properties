# Configurações do perfil de Produção (prod) - Render + PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Propriedades de fallback caso a variável DATABASE_URL (analisada no DatabaseConfig) não esteja presente
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Porta do Servidor (Render injetará a variável PORT, mas definimos o fallback aqui)
server.port=${PORT:8080}

# Segredo JWT injetado via variável de ambiente
jwt.secret=${JWT_SECRET}

# Endereço do frontend Vercel dinâmico
app.frontend.url=${FRONTEND_URL:https://meu-app.vercel.app}
